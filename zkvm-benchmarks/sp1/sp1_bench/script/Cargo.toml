[package]
version = "0.1.0"
name = "fibonacci-script"
edition = "2021"
default-run = "fibonacci"

[[bin]]
name = "fibonacci"
path = "src/bin/main.rs"

[dependencies]
sp1-sdk = { git = "https://github.com/succinctlabs/sp1", tag = "v5.2.4" }
clap = { version = "4.0", features = ["derive", "env"] }
tracing = "0.1.40"
fibonacci-lib = { path = "../lib" }
dotenv = "0.15.0"
